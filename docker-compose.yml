services:
  accesswork:
    build: .
    image: accesswork:latest
    ports:
      - "8080:80"
    environment:
      AW_HOST: "0.0.0.0"
      AW_PORT: "8765"
      AW_WHISPER_MODEL: ${AW_WHISPER_MODEL:-base}
    volumes:
      - whisper-cache:/root/.cache/whisper
      - piper-voices:/app/server/voices
    restart: unless-stopped

volumes:
  whisper-cache:
  piper-voices:
